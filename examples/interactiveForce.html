<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Force Directed Layout During Dragging</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  
  
  
</head>
<body>
<div id="myDiagramDiv" style="background-color: whitesmoke; border: solid 1px black; width: 100%; height: 700px"></div>
  <div id="description">
<p>As you drag a node around, the custom <a href="https://gojs.net/latest/api/symbols/ForceDirectedLayout.html" target="api">ForceDirectedLayout</a> operates continuously, causing other nodes to be pushed aside or pulled along.</p>
  <p>The graph is exactly the same as the <a href="conceptMap.html">Concept Map</a> sample. But the node template is different, and the layout is different.</p>
  </div>
  <script >
// This variation on ForceDirectedLayout does not move any selected Nodes
  // but does move all other nodes (vertexes).
  //
  // It is meant to be run repeatedly, once per mouse-move during a drag. This layout
  // treats each call as one small step of an ongoing simulation, so the graph eases
  // towards its new shape rather than snapping to it.
  class ContinuousForceDirectedLayout extends go.ForceDirectedLayout {
    constructor(init) {
      super();
      // how many iterations to run per mouse-move, once the graph has been laid out once;
      // the very first layout still gets the full ForceDirectedLayout.maxIterations
      this.dragIterations = 3;
      // fraction of each vertex's previous movement carried into its next one:
      // 0 makes nodes jitter back and forth, values near 1 make them barely respond
      this.smoothing = 0.75;
      if (init) Object.assign(this, init);
      this._hasLaidOut = false;
    }

    isFixed(v) {
      return v.node.isSelected;
    }

    // Move each vertex partway along the force acting on it, blended with the movement it made last time.
    moveVertex(v) {
      // the initial layout is a normal ForceDirectedLayout, so let it move nodes normally
      if (!this._hasLaidOut) return super.moveVertex(v);
      var mag = Math.sqrt(v.forceX * v.forceX + v.forceY * v.forceY);
      var scale = mag > 0 ? this.moveLimit / (this.moveLimit + mag) : 0;
      var keep = this.smoothing;
      var dx = (v.lastMoveX || 0) * keep + v.forceX * scale * (1 - keep);
      var dy = (v.lastMoveY || 0) * keep + v.forceY * scale * (1 - keep);
      v.lastMoveX = dx;
      v.lastMoveY = dy;
      v.centerX += dx;
      v.centerY += dy;
      return dx * dx + dy * dy;  // the square of the distance moved
    }

    // optimization: reuse the ForceDirectedNetwork rather than re-create it each time
    doLayout(coll) {
      if (!this._isObserving) {
        this._isObserving = true;
        // cacheing the network means we need to recreate it if nodes or links have been added or removed or relinked,
        // so we need to track structural model changes to discard the saved network.
        this.diagram.addModelChangedListener(e => {
          // modelChanges include a few cases that we don't actually care about, such as
          // "nodeCategory" or "linkToPortId", but we'll go ahead and recreate the network anyway.
          // Also clear the network when replacing the model.
          if (e.modelChange !== '' || (e.change === go.ChangeType.Transaction && e.propertyName === 'StartingFirstTransaction')) {
            this.network = null;
            // a brand new network needs a full layout again, not an incremental step
            this._hasLaidOut = false;
          }
        });
      }
      var net = this.network;
      if (net === null) {
        // the first time, just create the network as normal
        this.network = net = this.makeNetwork(coll);
      } else {
        // but on reuse we need to update the LayoutVertex.bounds for selected nodes
        this.diagram.nodes.each(n => {
          var v = net.findVertex(n);
          if (v !== null) v.bounds = n.actualBounds;
        });
      }
      // after the first layout, each call is just a nudge towards the new solution
      if (this._hasLaidOut) this.maxIterations = this.dragIterations;
      // now perform the normal layout
      super.doLayout(coll);
      // doLayout normally discards the LayoutNetwork by setting Layout.network to null;
      // here we remember it for next time
      this.network = net;
      this._hasLaidOut = true;
    }
  }
  // end ContinuousForceDirectedLayout

  function init() {
    myDiagram = new go.Diagram('myDiagramDiv', {
      initialAutoScale: go.AutoScale.Uniform, // an initial automatic zoom-to-fit
      contentAlignment: go.Spot.Center, // align document to the center of the viewport
      layout: new ContinuousForceDirectedLayout({ // automatically spread nodes apart while dragging
        moveLimit: 10,
        defaultElectricalCharge: 500
      }),
      // do an extra layout at the end of a move
      SelectionMoved: e => e.diagram.layout.invalidateLayout()
    });

    // dragging a node invalidates the Diagram.layout, causing a layout during the drag
    myDiagram.toolManager.draggingTool.doMouseMove = function () {
      // method override must be function, not =>
      go.DraggingTool.prototype.doMouseMove.call(this);
      if (this.isActive) this.diagram.layout.doLayout(this.diagram);
    };

    // define each Node's appearance
    myDiagram.nodeTemplate =
      new go.Node('Auto') // the whole node panel
        // define the node's outer shape, which will surround the TextBlock
        .add(
          new go.Shape('Circle', {
            fill: 'CornflowerBlue',
            stroke: 'black',
            spot1: new go.Spot(0, 0, 5, 5),
            spot2: new go.Spot(1, 1, -5, -5)
          }),
          new go.TextBlock({
              font: 'bold 10pt helvetica, bold arial, sans-serif',
              textAlign: 'center',
              maxSize: new go.Size(100, NaN)
            })
            .bind('text')
        );

    // the rest of this app is the same as samples/conceptMap.html

    // replace the default Link template in the linkTemplateMap
    myDiagram.linkTemplate =
      new go.Link() // the whole link panel
        .add(
          new go.Shape({ stroke: 'black' }), // the link shape
          new go.Shape({ toArrow: 'standard', stroke: null }), // the arrowhead
          new go.Panel('Auto')
            .add(
              new go.Shape({ // the label background, which becomes transparent around the edges
                fill: new go.Brush('Radial', { 0: 'rgb(240, 240, 240)', 0.3: 'rgb(240, 240, 240)', 1: 'rgba(240, 240, 240, 0)' }),
                stroke: null
              }),
              new go.TextBlock({ // the label text
                  textAlign: 'center',
                  font: '10pt helvetica, arial, sans-serif',
                  stroke: '#555555',
                  margin: 4
                })
                .bind('text')
            )
        );

    // create the model for the concept map
    var nodeDataArray = [
      { key: 1, text: 'Concept Maps' },
      { key: 2, text: 'Organized Knowledge' },
      { key: 3, text: 'Context Dependent' },
      { key: 4, text: 'Concepts' },
      { key: 5, text: 'Propositions' },
      { key: 6, text: 'Associated Feelings or Affect' },
      { key: 7, text: 'Perceived Regularities' },
      { key: 8, text: 'Labeled' },
      { key: 9, text: 'Hierarchically Structured' },
      { key: 10, text: 'Effective Teaching' },
      { key: 11, text: 'Crosslinks' },
      { key: 12, text: 'Effective Learning' },
      { key: 13, text: 'Events (Happenings)' },
      { key: 14, text: 'Objects (Things)' },
      { key: 15, text: 'Symbols' },
      { key: 16, text: 'Words' },
      { key: 17, text: 'Creativity' },
      { key: 18, text: 'Interrelationships' },
      { key: 19, text: 'Infants' },
      { key: 20, text: 'Different Map Segments' }
    ];
    var linkDataArray = [
      { from: 1, to: 2, text: 'represent' },
      { from: 2, to: 3, text: 'is' },
      { from: 2, to: 4, text: 'is' },
      { from: 2, to: 5, text: 'is' },
      { from: 2, to: 6, text: 'includes' },
      { from: 2, to: 10, text: 'necessary\nfor' },
      { from: 2, to: 12, text: 'necessary\nfor' },
      { from: 4, to: 5, text: 'combine\nto form' },
      { from: 4, to: 6, text: 'include' },
      { from: 4, to: 7, text: 'are' },
      { from: 4, to: 8, text: 'are' },
      { from: 4, to: 9, text: 'are' },
      { from: 5, to: 9, text: 'are' },
      { from: 5, to: 11, text: 'may be' },
      { from: 7, to: 13, text: 'in' },
      { from: 7, to: 14, text: 'in' },
      { from: 7, to: 19, text: 'begin\nwith' },
      { from: 8, to: 15, text: 'with' },
      { from: 8, to: 16, text: 'with' },
      { from: 9, to: 17, text: 'aids' },
      { from: 11, to: 18, text: 'show' },
      { from: 12, to: 19, text: 'begins\nwith' },
      { from: 17, to: 18, text: 'needed\nto see' },
      { from: 18, to: 20, text: 'between' }
    ];
    myDiagram.model = new go.GraphLinksModel(nodeDataArray, linkDataArray);
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
