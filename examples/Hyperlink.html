<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperlinks: Underlined Text When Clicked Opens a URL</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/gojs-extensions@latest/extensions/HyperlinkText.js"></script>
  
  
</head>
<body>
<div id="myDiagramDiv" style="border: solid 1px black; width: 100%; height: 400px"></div>
  <div id="description">
<p>This uses the "HyperlinkText" builder defined in <a href="https://gojs.net/latest/extensions/HyperlinkText.js">HyperlinkText.js</a>.</p>
  <p>
    Click on the text to open a window to a computed URL. A mouse-over on the text will underline the text. Hover on the text and you will see a tooltip showing
    the destination URL.
  </p>
  </div>
  <script >
function init() {

    myDiagram = new go.Diagram('myDiagramDiv');

    myDiagram.nodeTemplate =
      new go.Node('Auto')
        .add(
          new go.Shape('Ellipse', { fill: 'lightskyblue' }),
          go.GraphObject.build('HyperlinkText', { margin: 10 },
            node => 'https://gojs.net/' + node.data.version,
            node => 'Visit GoJS' +
                    ("0123456789".includes(node.data.version[0]) ? ", v" : " ") +
                    node.data.version
          )
        );

    myDiagram.model = new go.GraphLinksModel(
      [
        { key: 1, version: '3.0.22' },
        { key: 2, version: 'latest' }
      ],
      [{ from: 1, to: 2 }]
    );
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
