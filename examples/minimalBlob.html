<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Image Download Using MakeImageData and Blobs</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  
  
  
</head>
<body>
<div>
    <div id="myDiagramDiv" style="border: solid 1px black; width: 100%; height: 400px;"></div>
    <button id="blobButton">Make Blob and Download</button>
  </div>
  <div id="description">
<p>
    This sample shows how to use <a href="https://gojs.net/latest/api/symbols/Diagram.html#makeimagedata" target="api">Diagram.makeImageData</a> with the <code>returnType: "blob"</code> option and the necessary <code>callback</code> option. It
    also shows how to download a file that the page has generated.
  </p>
  </div>
  <script >
function init() {
    myDiagram = new go.Diagram('myDiagramDiv', {
      'undoManager.isEnabled': true // enable undo & redo
    });

    // define a simple Node template
    myDiagram.nodeTemplate =
      new go.Node('Auto')
        .add(
          // two elements: the Shape will go around the TextBlock
          new go.Shape('RoundedRectangle', { strokeWidth: 0, fill: 'white' }) // no border; default fill is white
            .bind('fill', 'color'), // Shape.fill is bound to Node.data.color
          new go.TextBlock({ margin: 8, font: 'bold 14px sans-serif', stroke: '#333' }) // some room around the text, bold font
            .bind('text') // TextBlock.text is bound to Node.data.text
        );

    // but use the default Link template, by not setting Diagram.linkTemplate

    // create the model data that will be represented by Nodes and Links
    myDiagram.model = new go.GraphLinksModel(
      [
        { key: 1, text: 'Alpha', color: 'lightblue' },
        { key: 2, text: 'Beta', color: 'orange' },
        { key: 3, text: 'Gamma', color: 'lightgreen' },
        { key: 4, text: 'Delta', color: 'pink' }
      ],
      [
        { from: 1, to: 2 },
        { from: 1, to: 3 },
        { from: 2, to: 2 },
        { from: 3, to: 4 },
        { from: 4, to: 1 }
      ]
    );

    document.getElementById('blobButton').addEventListener('click', makeBlob);
  }

  // When the blob is complete, make an anchor tag for it and use the tag to initiate a download
  // Works in Chrome, Firefox, Safari, Edge, IE11
  function myCallback(blob) {
    var url = window.URL.createObjectURL(blob);
    var filename = 'myBlobFile.png';

    var a = document.createElement('a');
    a.style = 'display: none';
    a.href = url;
    a.download = filename;

    // IE 11
    if (window.navigator.msSaveBlob !== undefined) {
      window.navigator.msSaveBlob(blob, filename);
      return;
    }

    document.body.appendChild(a);
    requestAnimationFrame(() => {
      a.click();
      window.URL.revokeObjectURL(url);
      document.body.removeChild(a);
    });
  }

  function makeBlob() {
    var blob = myDiagram.makeImageData({ background: 'white', returnType: 'blob', callback: myCallback });
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
