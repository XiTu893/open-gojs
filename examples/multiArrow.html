<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Arrowheads Along Link Path</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  
  
  
</head>
<body>
<div id="myDiagramDiv" style="border: solid 1px black; width: 100%; height: 700px; min-width: 200px"></div>
  <div id="description">
<p>This sample demonstrates customization of the <a href="https://gojs.net/latest/api/symbols/Link.html" target="api">Link</a> <a href="https://gojs.net/latest/api/symbols/Shape.html" target="api">Shape</a>'s <a href="https://gojs.net/latest/api/symbols/Geometry.html" target="api">Geometry</a>.</p>
  <p>
    The MultiArrowLink class in this sample inherits from Link and overrides the <a href="https://gojs.net/latest/api/symbols/Link.html#makegeometry" target="api">Link.makeGeometry</a> method to add arrowheads at the end of each interior
    segment, assuming that the route is orthogonal.
  </p>
  </div>
  <script >
// Produce a Geometry that includes an arrowhead at the end of each segment.
  // This only works with orthogonal non-Bezier routing.
  class MultiArrowLink extends go.Link {
    constructor(init) {
      super();
      this.routing = go.Routing.Orthogonal;
      if (init) Object.assign(this, init);
    }

    // produce a Geometry from the Link's route
    makeGeometry() {
      // get the Geometry created by the standard behavior
      const geo = super.makeGeometry();
      if (geo.type !== go.GeometryType.Path || geo.figures.length === 0) return geo;
      const mainfig = geo.figures.elt(0); // assume there's just one PathFigure
      const mainsegs = mainfig.segments;

      const arrowLen = 8; // length for each arrowhead
      const arrowWid = 3; // actually half-width of each arrowhead
      let fx = mainfig.startX;
      let fy = mainfig.startY;
      for (let i = 0; i < mainsegs.length; i++) {
        const a = mainsegs.elt(i);
        // assume each arrowhead is a simple triangle
        const ax = a.endX;
        const ay = a.endY;
        let bx = ax;
        let by = ay;
        let cx = ax;
        let cy = ay;
        if (fx < ax - arrowLen) {
          bx -= arrowLen;
          by += arrowWid;
          cx -= arrowLen;
          cy -= arrowWid;
        } else if (fx > ax + arrowLen) {
          bx += arrowLen;
          by += arrowWid;
          cx += arrowLen;
          cy -= arrowWid;
        } else if (fy < ay - arrowLen) {
          bx -= arrowWid;
          by -= arrowLen;
          cx += arrowWid;
          cy -= arrowLen;
        } else if (fy > ay + arrowLen) {
          bx -= arrowWid;
          by += arrowLen;
          cx += arrowWid;
          cy += arrowLen;
        }
        geo.add(
          new go.PathFigure(ax, ay, true)
            .add(new go.PathSegment(go.SegmentType.Line, bx, by))
            .add(new go.PathSegment(go.SegmentType.Line, cx, cy).close())
        );
        fx = ax;
        fy = ay;
      }

      return geo;
    }
  }
  // end of MultiArrowLink class

  function init() {
    myDiagram = new go.Diagram('myDiagramDiv', {
      layout: new go.ForceDirectedLayout(),
      'undoManager.isEnabled': true
    });

    myDiagram.nodeTemplate =
      new go.Node('Auto', { locationSpot: go.Spot.Center })
        .add(
          new go.Shape({
              figure: 'RoundedRectangle',
              parameter1: 10,
              fill: 'orange', // default fill color
              portId: '',
              fromLinkable: true,
              fromSpot: go.Spot.AllSides,
              toLinkable: true,
              toSpot: go.Spot.AllSides,
              cursor: 'pointer'
            })
            .bind('fill', 'color'),
          new go.TextBlock({ margin: 10, font: 'bold 12pt sans-serif' })
            .bind('text')
        );

    myDiagram.linkTemplate =
      new MultiArrowLink({ // subclass of Link, defined above
          relinkableFrom: true,
          relinkableTo: true,
          reshapable: true,
          resegmentable: true
        })
        .add(
          new go.Shape({ isPanelMain: true })
            .bind('fill', 'color')
          // no arrowhead is defined here -- they are hard-coded in MultiArrowLink.makeGeometry
        );

    // create a few nodes and links
    myDiagram.model = new go.GraphLinksModel(
      [
        { key: 1, text: 'one', color: 'lightyellow' },
        { key: 2, text: 'two', color: 'brown' },
        { key: 3, text: 'three', color: 'green' },
        { key: 4, text: 'four', color: 'slateblue' },
        { key: 5, text: 'five', color: 'aquamarine' },
        { key: 6, text: 'six', color: 'lightgreen' },
        { key: 7, text: 'seven' }
      ],
      [
        { from: 5, to: 6, color: 'orange' },
        { from: 1, to: 2, color: 'red' },
        { from: 1, to: 3, color: 'blue' },
        { from: 1, to: 4, color: 'goldenrod' },
        { from: 2, to: 5, color: 'fuchsia' },
        { from: 3, to: 5, color: 'green' },
        { from: 4, to: 5, color: 'black' },
        { from: 6, to: 7 }
      ]
    );
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
