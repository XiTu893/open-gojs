  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { color: #666; margin: 0 0 14px; font-size: 13px; }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar label { font-size: 13px; color: #444; }
  select, button { font-size: 13px; padding: 4px 10px; }
  #globalStatus { font-size: 13px; font-weight: 600; }
  .ok { color: #2f9e44; } .bad { color: #c0392b; } .warn { color: #b8860b; }
  .case { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .case h2 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .case h2 .st { font-size: 12px; font-weight: 500; }
  .case h2 .st-off { font-size: 12px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .grid.compare { grid-template-columns: 1fr 1fr; }
  .pane { min-width: 0; }
  .pane .tag { font-size: 12px; color: #666; margin: 0 0 4px; }
  .diagram, .official { border: 1px dashed #d6dae0; border-radius: 6px; background: #fff; overflow: auto; }
  .official:empty::before { content: "—"; color: #bbb; display: block; text-align: center; padding-top: 40px; }
  .official svg { max-width: 100%; height: auto; }
  .actions { margin-top: 8px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 12px; color: #555; }
  pre { background: #f4f6f8; border: 1px solid #e5e8ec; border-radius: 6px; padding: 10px 12px; font-size: 12px; overflow: auto; line-height: 1.5; }
</style>

<p class="sub">左栏 open-gojs，右栏官方 mermaid.js（vendor，运行时渲染，不支持的类型显示报错）。交互：拖拽平移、滚轮缩放、点击选中、右键菜单。</p>
<div class="toolbar">
  <label>主题
    <select id="themeSel">
      <option value="default" selected>default（pageFlow 彩色）</option>
      <option value="neutral">neutral（中性灰）</option>
      <option value="forest">forest（森林绿）</option>
      <option value="dark">dark（深色）</option>
    </select>
  </label>
  <label><input type="checkbox" id="compareChk" checked> 与官方 mermaid.js 并排对比</label>
  <button id="rerenderBtn">重新渲染全部</button>
  <span id="globalStatus">渲染中…</span>
</div>
<div id="cases"></div>

const diagrams = {};
let officialReady = false;
let mmdUid = 0;

function buildDom() {
  const root = document.getElementById('cases');
  for (const c of CASES) {
    const sec = document.createElement('section');
    sec.className = 'case';
    sec.id = 'pane-' + c.id;
    sec.innerHTML =
      '<h2>' + c.title +
      ' <span class="st"></span> <span class="st-off"></span></h2>' +
      '<div class="grid compare">' +
        '<div class="pane"><p class="tag">open-gojs</p>' +
          '<div class="diagram" style="height:' + c.h + 'px"></div></div>' +
        '<div class="pane pane-off"><p class="tag">官方 mermaid.js</p>' +
          '<div class="official" style="height:' + c.h + 'px"></div></div>' +
      '</div>' +
      '<div class="actions"><button class="pngBtn">导出 PNG（open-gojs）</button></div>' +
      '<details><summary>DSL 源码</summary><pre></pre></details>';
    sec.querySelector('pre').textContent = c.dsl;
    sec.querySelector('.pngBtn').addEventListener('click', () => {
      const d = diagrams[c.id];
      if (d) go.Mermaid.downloadPng(d, 'mermaid-' + c.id + '.png', { scale: 2 });
    });
    root.appendChild(sec);
  }
  document.getElementById('compareChk').addEventListener('change', (e) => {
    const on = e.target.checked;
    for (const c of CASES) {
      document.querySelector('#pane-' + c.id + ' .grid').classList.toggle('compare', on);
      document.querySelector('#pane-' + c.id + ' .pane-off').style.display = on ? '' : 'none';
      if (!on) document.querySelector('#pane-' + c.id + ' .st-off').textContent = '';
    }
    if (on) renderOfficialAll();
  });
}

function renderOpenAll(theme) {
  let okCount = 0;
  for (const c of CASES) {
    const sec = document.getElementById('pane-' + c.id);
    const host = sec.querySelector('.diagram');
    const fresh = host.cloneNode(false);
    fresh.style.height = c.h + 'px';
    host.replaceWith(fresh);
    const st = sec.querySelector('.st');
    try {
      const res = go.Mermaid.render(c.dsl, fresh, { theme: theme });
      if (res.diagram && res.diagram.nodes.count > 0) {
        diagrams[c.id] = res.diagram;
        st.textContent = 'open✓ ' + res.diagram.nodes.count + ' 节点';
        st.className = 'st ok';
        okCount++;
      } else {
        diagrams[c.id] = null;
        st.textContent = 'open✗ 无输出 ' + JSON.stringify(res.errors || []);
        st.className = 'st bad';
      }
    } catch (e) {
      diagrams[c.id] = null;
      st.textContent = 'open✗ ' + e.message;
      st.className = 'st bad';
    }
  }
  const gs = document.getElementById('globalStatus');
  gs.textContent = okCount + '/' + CASES.length + ' open-gojs 渲染成功（主题 ' + theme + '）';
  gs.className = okCount === CASES.length ? 'ok' : 'bad';
  window.__result = { ok: okCount === CASES.length, okCount, total: CASES.length, theme };
  return okCount;
}

async function renderOfficialAll() {
  if (!officialReady) return;
  let ok = 0;
  for (const c of CASES) {
    const sec = document.getElementById('pane-' + c.id);
    const host = sec.querySelector('.official');
    const st = sec.querySelector('.st-off');
    try {
      const { svg } = await mermaid.render('mmd-off-' + (mmdUid++), c.dsl);
      host.innerHTML = svg;
      st.textContent = '官方✓';
      st.className = 'st-off ok';
      ok++;
    } catch (e) {
      host.innerHTML = '';
      st.textContent = '官方✗ ' + (e && e.message ? e.message.split('\n')[0].slice(0, 80) : String(e).slice(0, 80));
      st.className = 'st-off warn';
    }
  }
  const gs = document.getElementById('globalStatus');
  gs.textContent += '；官方 mermaid.js ' + ok + '/' + CASES.length;
}

async function renderAll(theme) {
  renderOpenAll(theme);
  if (document.getElementById('compareChk').checked) {
    await renderOfficialAll();
  }
}

window.addEventListener('load', async () => {
  try {
    buildDom();
    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'default' });
      officialReady = true;
    } catch (e) {
      officialReady = false;
      document.getElementById('globalStatus').textContent = '官方 mermaid.js 加载失败：' + e.message;
    }
    const theme = document.getElementById('themeSel').value;
    await renderAll(theme);
    document.getElementById('themeSel').addEventListener('change', (e) => {
      try { if (officialReady) mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: e.target.value }); } catch (_) {}
      renderAll(e.target.value);
    });
    document.getElementById('rerenderBtn').addEventListener('click', () =>
      renderAll(document.getElementById('themeSel').value));
  } catch (e) {
    document.getElementById('globalStatus').textContent = 'ERR ' + e.message;
    window.__result = { ok: false, error: e.message, stack: e.stack };
  }
});
