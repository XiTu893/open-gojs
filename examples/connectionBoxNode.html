<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Box Editor with Custom Link Validation</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  
  
  
</head>
<body>
<div id="myDiagramDiv" style="border: solid 1px black; width: 100%; height: 600px; background-color: #333;"></div>
  <textarea id="mySavedModel" style="height: 300px" readonly></textarea>
  <div id="description">
<p>
    You can draw new links between ports, both between nodes and within a node. Between nodes, the
    link validation predicate requires new link connections to connect ports of the same color.
    However, within a node, links may connect ports of different colors.
  </p>
  </div>
  <script >
function init() {
    myDiagram = new go.Diagram('myDiagramDiv', {
      initialContentAlignment: go.Spot.Center, // for v1.*
      initialScale: 1.4,
      'undoManager.isEnabled': true,
      'linkingTool.direction': go.LinkingDirection.ForwardsOnly,
      ModelChanged: e => {
        // just for demonstration purposes,
        if (e.isTransactionFinished) {
          // show the model data in the page's TextArea
          document.getElementById('mySavedModel').value = e.model.toJson();
        }
      }
    });

    myDiagram.grid =
      new go.Panel("Grid")
        .add(
          new go.Shape("LineH", { 
            strokeWidth: 1, strokeDashArray: [0, 19, 1, 0], interval: 2 
          })
        );

    myDiagram.nodeTemplate =
      new go.Node('Table', {
        selectionObjectName: 'BODY',
        linkValidation: (fromnode, fromport, tonode, toport, link) => {
          if (!fromport || !toport) return false;
          if (fromnode === tonode) {
            // inside a node must go from an input port to an output port
            return fromport.portId[0] === 'i' && toport.portId[0] === 'o';
          } else {
            // between nodes the port colors must match
            if (fromport.fill !== toport.fill) return false;
            // between nodes must go from an output port to an input port
            return fromport.portId[0] === 'o' && toport.portId[0] === 'i';
          }
          return true;
        }
      })
        .bindTwoWay('location', 'location', go.Point.parse, go.Point.stringify)
        .addColumnDefinition(1, { width: 70 })
        .add(
          new go.Shape({
            name: 'BODY',
            row: 0,
            rowSpan: 99,
            column: 0,
            columnSpan: 3,
            stretch: go.Stretch.Fill,
            fill: 'lightgray',
            strokeWidth: 0,
            margin: new go.Margin(0, 8)
          }),
          new go.TextBlock({ row: 0, columnSpan: 3, margin: new go.Margin(4, 2, 2, 2) })
            .bind('text'),
          new go.TextBlock({ row: 2, columnSpan: 3, margin: new go.Margin(4, 2, 2, 2) })
            .bind('text', 'text2'),
          new go.Panel('Table', {
            row: 1,
            column: 0,
            defaultSeparatorPadding: new go.Margin(4, 0),
            // input ports
            itemTemplate:
              new go.Panel('TableRow', { background: 'white' })
                .add(
                  new go.Shape({
                    width: 6,
                    height: 6,
                    strokeWidth: 0,
                    margin: new go.Margin(2, 6, 2, 0),
                    fromSpot: go.Spot.Right,
                    toSpot: go.Spot.Left,
                    fromLinkable: true,
                    toLinkable: true,
                    fromLinkableSelfNode: true,
                    toLinkableSelfNode: true,
                    cursor: 'pointer'
                  })
                    .bindObject('portId', 'row', r => 'i' + r)
                    .bind('fill', '', convertToColor)
                )
            })
            .bind('itemArray', 'inPorts'),
          new go.Shape({
            row: 1,
            column: 1,
            fill: 'white',
            strokeWidth: 0,
            stretch: go.Stretch.Fill
          }),
          new go.Panel('Table', {
            row: 1,
            column: 2,
            defaultSeparatorPadding: new go.Margin(4, 0),
            // output ports
            itemTemplate:
              new go.Panel('TableRow', { background: 'white' })
                .add(
                  new go.Shape({
                    width: 6,
                    height: 6,
                    strokeWidth: 0,
                    margin: new go.Margin(2, 0, 2, 6),
                    fromSpot: go.Spot.Right,
                    toSpot: go.Spot.Left,
                    fromLinkable: true,
                    toLinkable: true,
                    fromLinkableSelfNode: true,
                    toLinkableSelfNode: true,
                    cursor: 'pointer'
                  })
                    .bindObject('portId', 'row', r => 'o' + r)
                    .bind('fill', '', convertToColor)
                )
            })
            .bind('itemArray', 'outPorts')
        );

    function convertToColor(n) {
      switch (n) {
        case 'r':
          return 'brown';
        case 'g':
          return 'olivedrab';
        case 'b':
          return 'cornflowerblue';
        default:
          return 'black';
      }
    }

    myDiagram.linkTemplate =
      new go.Link({ corner: 10, relinkableFrom: true, relinkableTo: true })
        .add(
          new go.Shape({ strokeWidth: 2 })
            .bindObject('stroke', 'fromPort', p => p.fill)
        );

    myDiagram.model = new go.GraphLinksModel({
      linkFromPortIdProperty: 'fpid',
      linkToPortIdProperty: 'tpid',
      copiesArrays: true,
      copiesArrayObjects: true,
      nodeDataArray: [
        {
          key: 1,
          text: 'Alpha',
          location: '0 0',
          inPorts: ['r', 'r', 'r', 'g', 'b'],
          outPorts: ['r', 'g', 'g', 'b', 'b']
        },
        {
          key: 2,
          text: 'Beta',
          location: '200 -80',
          inPorts: ['r', 'r', 'g', 'g', 'b'],
          outPorts: ['r', 'r', 'g', 'g', 'b']
        },
        {
          key: 3,
          text: 'Gamma',
          location: '200 80',
          inPorts: ['r', 'r', 'g', 'g', 'b'],
          outPorts: ['r', 'r', 'g', 'g', 'b']
        }
      ],
      linkDataArray: [
        { from: 1, fpid: 'i0', to: 1, tpid: 'o1' },
        { from: 1, fpid: 'i1', to: 1, tpid: 'o4' },
        { from: 1, fpid: 'i2', to: 1, tpid: 'o0' },
        { from: 1, fpid: 'i3', to: 1, tpid: 'o3' },
        { from: 1, fpid: 'i4', to: 1, tpid: 'o2' },

        { from: 1, fpid: 'o0', to: 2, tpid: 'i0' },
        { from: 1, fpid: 'o2', to: 2, tpid: 'i2' },
        { from: 1, fpid: 'o2', to: 3, tpid: 'i2' },
        { from: 1, fpid: 'o3', to: 2, tpid: 'i4' },
        { from: 1, fpid: 'o3', to: 3, tpid: 'i4' },

        { from: 2, fpid: 'i0', to: 2, tpid: 'o1' },
        { from: 2, fpid: 'i2', to: 2, tpid: 'o0' },
        { from: 2, fpid: 'i4', to: 2, tpid: 'o2' },
        { from: 3, fpid: 'i2', to: 3, tpid: 'o3' },
        { from: 3, fpid: 'i1', to: 3, tpid: 'o1' }
      ]
    });
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
