<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resizing via Pinch Zooming</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  
  
  
</head>
<body>
<!-- The DIV for the Diagram needs an explicit size or else we won't see anything.
       This also adds a border to help see the edges of the viewport. -->
  <div id="myDiagramDiv" style="border: solid 1px black; width: 100%; height: 400px"></div>
  <div id="description">
<p>
    This sample gives an example of customizing <a href="https://gojs.net/latest/api/symbols/PanningTool.html" target="api">PanningTool</a>.
    Select a node and pinch zoom to see the action modify the scale and angle of the Node
    instead of the scale of the Diagram.
  </p>
  </div>
  <script >
// Override normal panning & pinch zoom to rescale and rotate the selected node, instead of the Diagram.
  // This does not try to move the selected non-Link Part, but scaling or rotation might cause the Part's location to change.
  class PinchRescalingTool extends go.PanningTool {
    constructor(init) {
      super();
      this.currentPart = null;
      if (init) Object.assign(this, init);
    }

    doActivate() {
      const diagram = this.diagram;
      if (diagram === null) return;
      super.doActivate();
      const node = diagram.selection.first();
      if (node instanceof go.Node) {
        this.currentPart = node;
        this.originalPosition = node.location;
        this.originalScale = node.scale;
        this.originalAngle = node.angle;
        this.startTransaction("Rescaling");
      }
    }

    doDeactivate() {
      super.doDeactivate();
      if (this.currentPart) {
        this.stopTransaction();
        this.currentPart = null;
      }
    }

    doCancel() {
      if (this.currentPart) {
        this.currentPart.location = this.originalPosition;
        this.currentPart.scale = this.originalScale;
        this.currentPart.angle = this.originalAngle;
      }
      super.doCancel();
    }

    doMouseUp() {
      this.transactionResult = "Rescaled";
      super.doMouseUp();
    }

    // DIST will be zero if the event is not a multi-touch event
    pan(newposition, newscale, newangle, dist, angle, scalecenter) {
      const diagram = this.diagram;
      if (diagram === null) return;
      const node = this.currentPart;
      if (node !== null && (this.startedScaling || this.startedRotating)) {
        if (this.startedScaling && dist > this.scaleMinimumThreshold) node.scale = newscale;
        if (this.startedRotating && dist > 0) node.angle = newangle;
      } else {
        super.pan(newposition, newscale, newangle, dist, angle, scalecenter);
      }
    }
  }  // end of PinchResizingTool


  function init() {
    myDiagram = new go.Diagram('myDiagramDiv', {
      // replace the standard ToolManager with a PinchResizingTool
      panningTool: new PinchRescalingTool(),
      'undoManager.isEnabled': true // enable undo & redo
    });

    // define a simple Node template
    myDiagram.nodeTemplate =
      new go.Node('Auto') // the Shape will go around the TextBlock
        .add(
          new go.Shape('RoundedRectangle', { strokeWidth: 0 })
            // Shape.fill is bound to Node.data.color
            .bind('fill', 'color'),
          new go.TextBlock({ margin: 8 }) // some room around the text
            // TextBlock.text is bound to Node.data.text
            .bind('text')
        );

    myDiagram.model = new go.GraphLinksModel(
      [
        { key: 1, text: 'Alpha', color: 'lightblue' },
        { key: 2, text: 'Beta', color: 'orange' },
        { key: 3, text: 'Gamma', color: 'lightgreen' },
        { key: 4, text: 'Delta', color: 'pink' }
      ],
      [
        { from: 1, to: 2 },
        { from: 1, to: 3 },
        { from: 2, to: 2 },
        { from: 3, to: 4 },
        { from: 4, to: 1 }
      ]
    );
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
