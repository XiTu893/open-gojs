<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candlestick Charts or Range Charts in Nodes</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  
  
  
</head>
<body>
<div
    id="myDiagramDiv"
    style="background-color: white; border: solid 1px black; width: 100%; height: 500px"></div>
  <div id="description">
<p>
    This is a simple example of a candlestick chart made using a custom <a href="https://gojs.net/latest/api/symbols/Geometry.html" target="api">Geometry</a>
    inside the <a href="https://gojs.net/latest/api/symbols/Panel.html#itemtemplate" target="api">Panel.itemTemplate</a>.
  </p>
  <p>
    For more sophisticated charts within nodes, see the
    <a href="canvases.html">Canvas Charts</a> sample.
  </p>
  </div>
  <script >
function init() {
    myDiagram = new go.Diagram('myDiagramDiv');

    // the template for each attribute in a node's array of item data
    var itemTempl =
      new go.Panel('TableRow')
        .add(
          new go.TextBlock({ column: 0 })
            .bind('text'),
          new go.Shape({
              column: 1,
              alignment: go.Spot.Left,
              fill: 'slateblue',
              stroke: 'darkblue'
            })
            .bind('geometry', '', produceRange)
        );

    function produceRange(d) {
      var h = 12; // total height for the markers
      var w = 3; // half width for the median marker
      // using constructors is more efficient than calling go.GraphObject.mak:
      return new go.Geometry()
        .add(
          new go.PathFigure(d.min, h / 2, false)
            .add(new go.PathSegment(go.SegmentType.Line, d.max, h / 2))
        )
        .add(
          new go.PathFigure(d.min, 0, false)
            .add(new go.PathSegment(go.SegmentType.Line, d.min, h))
        )
        .add(
          new go.PathFigure(d.max, 0, false)
            .add(new go.PathSegment(go.SegmentType.Line, d.max, h))
        )
        .add(
          new go.PathFigure(d.val - w, 0)
            .add(new go.PathSegment(go.SegmentType.Line, d.val + w, 0))
            .add(new go.PathSegment(go.SegmentType.Line, d.val + w, h))
            .add(new go.PathSegment(go.SegmentType.Line, d.val - w, h).close())
        );
    }

    myDiagram.nodeTemplate =
      new go.Node('Auto')
        .add(
          new go.Shape({ fill: 'white' }),
          new go.Panel('Table', {
              margin: 6,
              itemTemplate: itemTempl
            })
            .bind('itemArray', 'items')
        );

    const nodeDataArray = [
      {
        items: [
          { text: 'first', min: 10, val: 50, max: 60 },
          { text: 'second', min: 20, val: 70, max: 90 },
          { text: 'third', min: 40, val: 60, max: 110 },
          { text: 'fourth', min: 50, val: 80, max: 130 }
        ]
      }
    ];

    myDiagram.model = new go.GraphLinksModel({
      copiesArrays: true,
      copiesArrayObjects: true,
      nodeDataArray: nodeDataArray
    });
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
