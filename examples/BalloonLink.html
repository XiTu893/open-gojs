<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Links for Creating Speech Bubbles or Comments for Nodes</title>
  <script src="../dist/open-gojs.umd.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/gojs-extensions@latest/extensions/BalloonLink.js"></script>
  
  
</head>
<body>
<div id="myDiagramDiv" style="border: solid 1px black; width: 100%; height: 400px;"></div>
  <div id="description">
<p>
    A <b>BalloonLink</b> is a custom <a href="https://gojs.net/latest/api/symbols/Link.html" target="api">Link</a> that draws a "balloon" shape around the Link.fromNode. It will create a triangular shape with the base at the
    fromNode and the other point at the toNode. It is defined in its own file, as <a href="https://gojs.net/latest/extensions/BalloonLink.js">BalloonLink.js</a>.
  </p>
  <p>Usage can also be seen in the <a href="comments.html">Comments</a> sample.</p>
  </div>
  <script >
function init() {
    myDiagram = new go.Diagram('myDiagramDiv', {
      'undoManager.isEnabled': true // enable undo & redo
    });

    // define a simple Node template
    myDiagram.nodeTemplate =
      new go.Node('Auto', { margin: 2 }) // the Shape will go around the TextBlock
        .add(
          new go.Shape('Rectangle', { strokeWidth: 0 })
            // Shape.fill is bound to Node.data.color
            .bind('fill', 'color'),
          new go.TextBlock({ margin: 8 }) // some room around the text
            // TextBlock.text is bound to Node.data.text
            .bind('text')
        );

    myDiagram.linkTemplate =
      new BalloonLink()
        .add(
          new go.Shape({ stroke: 'limegreen', strokeWidth: 3, fill: 'limegreen' })
        );

    // create the model data that will be represented by Nodes and Links
    myDiagram.model = new go.GraphLinksModel(
      [
        { key: 1, text: 'Alpha', color: 'lightblue' },
        { key: 2, text: 'Beta', color: 'orange' }
      ],
      [{ from: 1, to: 2 }]
    );
  }

  window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
